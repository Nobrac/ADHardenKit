name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish gui/ADHardenKit.Gui/ADHardenKit.Gui.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Package
        shell: pwsh
        run: |
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Copy-Item ADHardenKit.ps1, Verify-LoggingDeployment.ps1, Verify-MemberDeployment.ps1, README.md, LICENSE, CHANGELOG.md -Destination publish
          Compress-Archive -Path publish/* -DestinationPath "ADHardenKit-${{ github.ref_name }}-win-x64.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "ADHardenKit-${{ github.ref_name }}-win-x64.zip" --title "${{ github.ref_name }}" --notes-file CHANGELOG.md
