name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    name: Analyzer and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -MinimumVersion 1.22.0 -Scope CurrentUser -Force
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = @(Get-ChildItem -Filter *.ps1 -Recurse |
              Where-Object FullName -notmatch '[\\/]gui[\\/]' |
              ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Settings ./PSScriptAnalyzerSettings.psd1 })
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($results.Count) { throw "$($results.Count) analyzer finding(s)" }

      - name: Pester (PowerShell 7)
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          Invoke-Pester -Configuration $cfg

  gui:
    name: GUI build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test gui/ADHardenKit.Gui.Tests -c Release

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish gui/ADHardenKit.Gui/ADHardenKit.Gui.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Package
        shell: pwsh
        run: |
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Copy-Item ADHardenKit.ps1, Verify-LoggingDeployment.ps1, Verify-MemberDeployment.ps1, README.md, LICENSE -Destination publish

      - uses: actions/upload-artifact@v4
        with:
          name: ADHardenKit-win-x64
          path: publish/
